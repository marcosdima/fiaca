[project]
name = "fiaca"
version = "0.1.0"
description = "Terminal coding assistant with configurable AI providers"
readme = "README.md"
authors = [
    { name = "marcosdima", email = "marcosdimatteo.wgr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
    "rich>=14.0.0",
]

[project.scripts]
fiaca = "fiaca.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
